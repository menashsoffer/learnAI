<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בינה מלאכותית בשירות השלטון המקומי | הרצאה לצוערים</title>
  <meta name="description" content="אתר-מצגת אינטראקטיבי: בינה מלאכותית ככלי עבודה יומיומי לצוערים לשלטון המקומי">
  
  <style>
    /* ==========================================
       DESIGN SYSTEM & CSS VARIABLES
       ========================================== */
    :root {
      /* Brand Color Palette (PPTX Approved + Modern Dark/Glass Palette) */
      --brand-primary: #26495C;
      --brand-primary-light: #3A6B84;
      --brand-accent: #00D2D3;
      --brand-accent-glow: rgba(0, 210, 211, 0.3);
      --brand-secondary: #008080;
      
      --bg-main: #0B131F;
      --bg-card: rgba(38, 73, 92, 0.25);
      --bg-card-hover: rgba(38, 73, 92, 0.45);
      --bg-glass: rgba(15, 23, 42, 0.75);
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --border-light: rgba(255, 255, 255, 0.12);
      --border-glow: rgba(0, 210, 211, 0.5);
      
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      
      /* Typography */
      --font-family: 'Rubik', 'Assistant', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Motion */
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: all 0.15s ease-out;
      
      /* Layout & Spacing */
      --header-height: 56px;
      --container-max-w: 1280px;
    }

    /* Base Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      direction: rtl;
      user-select: none;
    }

    /* Ambient Background Effects */
    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      animation: floatOrb 20s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: var(--brand-primary);
      top: -100px;
      right: -100px;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: var(--brand-accent);
      bottom: -100px;
      left: -100px;
      animation-delay: -10s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    /* Header & Navigation Bar */
    header.top-bar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: var(--header-height);
      background: rgba(11, 19, 31, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 50;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .brand-badge {
      background: var(--brand-primary);
      color: var(--brand-accent);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: 1px solid rgba(0, 210, 211, 0.3);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .progress-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .act-tag {
      color: var(--brand-accent);
      font-weight: 600;
      margin-right: 0.4rem;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--brand-accent);
      color: var(--brand-accent);
    }

    /* Progress Line Motif Header */
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand-primary-light), var(--brand-accent));
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px var(--brand-accent-glow);
    }

    /* Main Viewport Container */
    main.presentation-viewport {
      position: relative;
      width: 100vw;
      height: calc(100vh - var(--header-height));
      margin-top: var(--header-height);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Slide Container & Smooth Directional Transitions */
    .slide-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: translate3d(-60px, 0, 0);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.45s;
      will-change: opacity, transform;
    }

    /* Active Slide: Centered & Fully Visible */
    .slide-wrapper.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transform: translate3d(0, 0, 0);
      z-index: 2;
    }

    /* Previous Slide (to the right in RTL): Exits to the right */
    .slide-wrapper.prev {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: translate3d(60px, 0, 0);
      z-index: 1;
    }

    /* Next Slide (to the left in RTL): Waits on the left */
    .slide-wrapper.next {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: translate3d(-60px, 0, 0);
      z-index: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .slide-wrapper {
        transition: opacity 0.15s ease !important;
        transform: none !important;
      }
    }

    /* Slide Inner Content Box */
    .slide-content {
      width: 100%;
      max-width: var(--container-max-w);
      max-height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--brand-primary) transparent;
    }

    .slide-content::-webkit-scrollbar {
      width: 6px;
    }
    .slide-content::-webkit-scrollbar-thumb {
      background: var(--brand-primary);
      border-radius: 4px;
    }

    /* VISUAL MOTIF: Continuous Accent Line */
    .line-motif {
      width: 70px;
      height: 4px;
      background: linear-gradient(90deg, var(--brand-accent), transparent);
      border-radius: 2px;
      margin-bottom: 0.5rem;
      box-shadow: 0 0 8px var(--brand-accent-glow);
    }

    /* Slide Typography Standards */
    .slide-title {
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .slide-subtitle {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      color: var(--brand-accent);
      font-weight: 500;
      margin-top: -0.5rem;
    }

    .slide-body {
      font-size: clamp(1rem, 1.4vw, 1.25rem);
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* Self-Reading Box (מצב קריאה עצמית) */
    .self-reading-box {
      background: rgba(255, 255, 255, 0.03);
      border-right: 3px solid var(--brand-accent);
      padding: 1rem 1.25rem;
      border-radius: 0 10px 10px 0;
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .self-reading-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--brand-accent);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* UI COMPONENTS & LAYOUTS */

    /* 1. Hero Layout */
    .layout-hero {
      text-align: center;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      color: var(--brand-accent);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .hero-title {
      font-size: clamp(2.5rem, 5vw, 4.2rem);
      font-weight: 900;
      background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 60%, var(--brand-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 950px;
    }

    .hero-motto {
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      color: var(--brand-accent);
      font-weight: 600;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      background: rgba(0, 210, 211, 0.08);
      border: 1px dashed var(--border-glow);
    }

    /* 2. Interactive Warmup / Local Answer */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 700px;
      margin: 1.5rem auto 0 auto;
    }

    .custom-textarea {
      width: 100%;
      height: 140px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1rem;
      color: #FFF;
      font-family: inherit;
      font-size: 1.1rem;
      resize: none;
      transition: var(--transition-smooth);
    }

    .custom-textarea:focus {
      outline: none;
      border-color: var(--brand-accent);
      box-shadow: 0 0 15px var(--brand-accent-glow);
    }

    .saved-status {
      font-size: 0.85rem;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .saved-status.active {
      opacity: 1;
    }

    /* 3. Cards Grid (Click to reveal / Info cards) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      margin-top: 1rem;
    }

    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: var(--transition-smooth);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .info-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      transform: translateY(-4px);
    }

    .card-icon {
      font-size: 2rem;
      color: var(--brand-accent);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #FFF;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* 4. Section Cover */
    .section-cover {
      text-align: center;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .unit-number-badge {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--brand-accent);
      text-transform: uppercase;
      padding: 0.4rem 1.2rem;
      background: rgba(0, 210, 211, 0.1);
      border-radius: 999px;
      border: 1px solid var(--border-glow);
    }

    .unit-title {
      font-size: clamp(2.5rem, 4.5vw, 3.8rem);
      font-weight: 900;
      color: #FFF;
    }

    /* 5. Archivist Animation Component */
    .archivist-container {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .stack-box, .pattern-box {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 2rem;
      width: 280px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .archivist-arrow {
      font-size: 2.5rem;
      color: var(--brand-accent);
      animation: pulseArrow 2s infinite ease-in-out;
    }

    @keyframes pulseArrow {
      0%, 100% { transform: translateX(0); opacity: 0.6; }
      50% { transform: translateX(-10px); opacity: 1; }
    }

    /* 6. Two Column Advantage vs Risk Layout */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 1rem;
    }

    @media (max-width: 768px) {
      .two-col-grid {
        grid-template-columns: 1fr;
      }
    }

    .col-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.75rem;
      border: 1px solid var(--border-light);
    }

    .col-card.advantage {
      border-top: 4px solid var(--success);
    }

    .col-card.risk {
      border-top: 4px solid var(--warning);
    }

    .col-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    /* 7. Layered Diagram Layout (Chat -> Agent -> Tools) */
    .layers-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 800px;
      margin: 1rem auto;
    }

    .layer-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.25rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      transition: var(--transition-smooth);
    }

    .layer-card.highlight {
      border-color: var(--brand-accent);
      background: rgba(0, 210, 211, 0.1);
      box-shadow: 0 0 15px var(--brand-accent-glow);
    }

    .layer-num {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--brand-accent);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 8. Mini Game Layout */
    .game-container {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 850px;
      margin: 1rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .game-quote-box {
      background: rgba(15, 23, 42, 0.9);
      border-right: 4px solid var(--brand-accent);
      padding: 1.25rem 1.5rem;
      border-radius: 8px;
      font-size: 1.15rem;
      line-height: 1.6;
      color: #FFF;
      font-style: italic;
    }

    .game-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn-game-opt {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      padding: 1rem;
      border-radius: 12px;
      color: #FFF;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-game-opt:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--brand-accent);
    }

    .btn-game-opt.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: var(--success) !important;
      color: #34D399 !important;
    }

    .btn-game-opt.incorrect {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: var(--danger) !important;
      color: #F87171 !important;
    }

    .game-feedback {
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      min-height: 28px;
    }

    /* 9. Workshop Timer Layout */
    .timer-display-box {
      text-align: center;
      background: var(--bg-card);
      border: 2px solid var(--brand-accent);
      border-radius: 24px;
      padding: 2.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 0 30px var(--brand-accent-glow);
      max-width: 600px;
      margin: 1.5rem auto;
    }

    .timer-clock {
      font-size: clamp(3.5rem, 8vw, 6rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #FFF;
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px var(--brand-accent-glow);
    }

    .timer-controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-action {
      background: var(--brand-primary);
      border: 1px solid var(--brand-accent);
      color: #FFF;
      padding: 0.75rem 1.75rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-action:hover {
      background: var(--brand-primary-light);
      box-shadow: 0 0 15px var(--brand-accent-glow);
      transform: translateY(-2px);
    }

    .btn-action.secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-light);
    }

    .external-notice {
      font-size: 0.85rem;
      color: var(--warning);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    /* OVERLAYS & MODALS */

    /* Grid Overview Modal (Esc) */
    .grid-modal-overlay {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(11, 19, 31, 0.95);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: var(--transition-smooth);
    }

    .grid-modal-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .grid-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-light);
    }

    .grid-modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #FFF;
    }

    .grid-modal-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .grid-thumb-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1.25rem;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .grid-thumb-card:hover, .grid-thumb-card.current {
      border-color: var(--brand-accent);
      background: rgba(0, 210, 211, 0.15);
      transform: translateY(-3px);
    }

    .grid-thumb-num {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--brand-accent);
    }

    .grid-thumb-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #FFF;
      line-height: 1.3;
    }

    /* Presenter Notes Overlay (N) */
    .presenter-notes-drawer {
      position: fixed;
      bottom: 1rem;
      left: 1.5rem;
      width: 380px;
      max-width: calc(100vw - 3rem);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--brand-accent);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      z-index: 90;
      transform: translateY(120%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .presenter-notes-drawer.active {
      transform: translateY(0);
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-light);
    }

    .notes-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--brand-accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .notes-content {

    /* ==========================================

    class PresentationEngine {
      constructor() {
        this.currentIndex = 0;
        this.totalSlides = SCENES.length;
        this.timerInterval = null;
        this.timerSeconds = 600;
        this.timerRunning = false;
        this.isUpdatingHash = false;
        
        // Initial deep link check before render
        const initialHash = window.location.hash;
        if (initialHash.startsWith('#/')) {
          const slideNum = parseInt(initialHash.replace('#/', ''), 10);
          if (!isNaN(slideNum) && slideNum >= 1 && slideNum <= this.totalSlides) {
            this.currentIndex = slideNum - 1;
          }
        }

        // DOM Elements
        this.viewport = document.getElementById('viewport');
        this.slideCounter = document.getElementById('slideCounter');
        this.actTag = document.getElementById('actTag');
        this.progressBar = document.getElementById('progressBar');
        
        this.gridModal = document.getElementById('gridModal');
        this.gridCardsContainer = document.getElementById('gridCardsContainer');
        this.notesDrawer = document.getElementById('notesDrawer');
        this.notesContent = document.getElementById('notesContent');
        
        this.init();
      }

      init() {
        this.renderSlides();
        this.renderGridItems();
        this.setupEventListeners();
        this.updateUI();
        
        // Restore local answer for Scene 2 if exists
        const savedAnswer = localStorage.getItem('cadet_warmup_answer');
        if (savedAnswer) {
          const textarea = document.getElementById('warmupAnswerInput');
          if (textarea) textarea.value = savedAnswer;
        }
      }

        this.viewport.innerHTML = '';
        SCENES.forEach((scene, index) => {
          const slideEl = document.createElement('div');
          let stateClass = 'next';
          if (index === this.currentIndex) stateClass = 'active';
          else if (index < this.currentIndex) stateClass = 'prev';

          slideEl.className = `slide-wrapper ${stateClass}`;
          slideEl.id = `slide-${index}`;
          slideEl.setAttribute('role', 'region');
          slideEl.setAttribute('aria-label', `סצנה ${scene.id}: ${scene.title}`);

                  <div class="two-col-grid">
                    <div class="col-card advantage">
                      <div class="col-header" style="color:var(--success);">${scene.col1Title}</div>
                      <div style="color:var(--text-muted); line-height:1.7;">${scene.col1Text}</div>
                    </div>
                    <div class="col-card risk">
                      <div class="col-header" style="color:var(--warning);">${scene.col2Title}</div>
                      <div style="color:var(--text-muted); line-height:1.7;">${scene.col2Text}</div>
                    </div>
                  </div>
                  <div class="self-reading-box">
                    <div class="self-reading-label">📖 מצב קריאה עצמית</div>
                    ${scene.selfReading}
                  </div>
                </div>
              `;
              break;

            case 'layered-diagram':
              const layersHtml = scene.layers.map(l => `
                <div class="layer-card ${l.num === '2' ? 'highlight' : ''}">
                  <div class="layer-num">${l.num}</div>
                  <div style="flex:1;">
                    <strong style="color:#FFF; font-size:1.1rem;">${l.name}</strong>
                    <div style="font-size:0.9rem; color:var(--text-muted);">${l.desc}</div>
                  </div>
                </div>
              `).join('');

              contentInnerHtml = `
                <div class="slide-content">
                  <div class="line-motif"></div>
                  <h2 class="slide-title">${scene.title}</h2>
                  <div class="slide-subtitle">${scene.subtitle}</div>
                  <div class="layers-container">${layersHtml}</div>
                  <div class="self-reading-box">
                    <div class="self-reading-label">📖 מצב קריאה עצמית</div>
                    ${scene.selfReading}
                  </div>
                </div>
              `;
              break;

            case 'mini-game':
              const optsHtml = scene.options.map((opt, i) => `
                <button class="btn-game-opt" onclick="app.checkGameAnswer(${scene.gameId}, ${opt.correct}, this)">
                  ${opt.text}
                </button>
              `).join('');

              contentInnerHtml = `
                <div class="slide-content" style="align-items:center;">
                  <div class="line-motif"></div>
                  <h2 class="slide-title">${scene.title}</h2>
                  <div class="slide-subtitle">${scene.subtitle}</div>
                  <div class="game-container">
                    <div class="game-quote-box">${scene.quote}</div>
                    <div class="game-options">${optsHtml}</div>
                    <div class="game-feedback" id="gameFeedback-${scene.gameId}"></div>
                  </div>
                  <div class="self-reading-box" style="width:100%; max-width:850px;">
                    <div class="self-reading-label">📖 מצב קריאה עצמית</div>
                    ${scene.selfReading}
                  </div>
                </div>
              `;
              break;

            case 'content-skill':
              contentInnerHtml = `
                <div class="slide-content">
                  <div class="line-motif"></div>
                  <div style="display:flex; align-items:center; gap:0.75rem;">
                    <span class="hero-badge" style="font-size:0.8rem; padding:0.25rem 0.75rem;">${scene.badge}</span>
                    <h2 class="slide-title" style="font-size:clamp(1.75rem,3.2vw,2.5rem);">${scene.title}</h2>
                  </div>
                  <div class="slide-subtitle">${scene.subtitle}</div>
                  <div style="margin-top:0.5rem;">${scene.contentHtml}</div>
                  <div class="self-reading-box">
                    <div class="self-reading-label">📖 מצב קריאה עצמית</div>
                    ${scene.selfReading}
                  </div>
                </div>
              `;
              break;

            case 'workshop-instructions':
              contentInnerHtml = `
                <div class="slide-content">
                  <div class="line-motif"></div>
                  <h2 class="slide-title">${scene.title}</h2>
                  <div class="slide-subtitle">${scene.subtitle}</div>
                  <div style="background:var(--bg-card); border:1px solid var(--border-light); border-radius:16px; padding:1.5rem;">
                    ${scene.instructionsHtml}
                  </div>
                  <div class="self-reading-box">
                    <div class="self-reading-label">📖 מצב קריאה עצמית</div>
                    ${scene.selfReading}
                  </div>
                </div>
              `;
              break;

            case 'workshop-timer':
              contentInnerHtml = `
                <div class="slide-content" style="align-items:center;">
                  <div class="line-motif"></div>
                  <h2 class="slide-title">${scene.title}</h2>
                  <div class="slide-subtitle">${scene.subtitle}</div>
                  
                  <div class="timer-display-box">
                    <div class="timer-clock" id="timerClock">10:00</div>
                    <div class="timer-controls">
                      <button class="btn-action" onclick="app.toggleTimer()" id="btnTimerToggle">▶ התחל טיימר</button>
                      <button class="btn-action secondary" onclick="app.adjustTimer(60)">+1 דקה</button>
                      <button class="btn-action secondary" onclick="app.adjustTimer(-60)">-1 דקה</button>
                      <button class="btn-action secondary" onclick="app.resetTimer()">🔄 איפוס</button>
                    </div>
                  </div>

                  <div class="self-reading-box" style="width:100%; max-width:600px;">
                    <div class="self-reading-label">📖 מצב קריאה עצמית</div>
                    ${scene.selfReading}
                  </div>
                </div>
              `;
              break;

            default:
              contentInnerHtml = `<div class="slide-content"><h2 class="slide-title">${scene.title}</h2></div>`;
          }

          slideEl.innerHTML = contentInnerHtml;
          this.viewport.appendChild(slideEl);
        });
      }

      /* Render Grid Modal Items */
      renderGridItems() {
        this.gridCardsContainer.innerHTML = '';
        SCENES.forEach((scene, idx) => {
          const card = document.createElement('div');
          card.className = `grid-thumb-card ${idx === this.currentIndex ? 'current' : ''}`;
          card.onclick = () => {
            this.goToSlide(idx);
            this.toggleGridModal(false);
          };
          card.innerHTML = `
            <div class="grid-thumb-num">סצנה ${scene.id} · ${scene.act}</div>
            <div class="grid-thumb-title">${scene.title}</div>
          `;
          this.gridCardsContainer.appendChild(card);
        });
      }

      /* Setup Navigation & Keyboard Listeners */
      setupEventListeners() {
        // Navigation Buttons
        document.getElementById('btnNext').onclick = () => this.nextSlide();
        document.getElementById('btnPrev').onclick = () => this.prevSlide();

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

          switch (e.key) {
            case 'ArrowLeft':
            case 'PageDown':
            case ' ':
              e.preventDefault();
              this.nextSlide();
              break;
            case 'ArrowRight':
            case 'PageUp':
              e.preventDefault();
              this.prevSlide();
              break;
            case 'Escape':
              e.preventDefault();
              this.toggleGridModal();
              break;
            case 'n':
            case 'N':
              e.preventDefault();
              this.toggleNotesDrawer();
              break;
            case 'f':
            case 'F':
              e.preventDefault();
              this.toggleFullscreen();
              break;
          }
        });

        // Touch Swipe Gestures
        let touchStartX = 0;
        window.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
          if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
          const touchEndX = e.changedTouches[0].screenX;
          const diff = touchEndX - touchStartX;

          if (Math.abs(diff) > 50) {
            if (diff < 0) {
              // Swipe Left -> Next Slide (RTL context)
              this.nextSlide();
            } else {
              // Swipe Right -> Prev Slide
              this.prevSlide();
            }
          }
        }, { passive: true });

        // Hash Navigation
        window.addEventListener('hashchange', () => this.handleHashChange());

        // Header Buttons
        document.getElementById('btnGrid').onclick = () => this.toggleGridModal();
        document.getElementById('btnCloseGrid').onclick = () => this.toggleGridModal(false);
        document.getElementById('btnNotes').onclick = () => this.toggleNotesDrawer();
        document.getElementById('btnCloseNotes').onclick = () => this.toggleNotesDrawer(false);
        document.getElementById('btnFullscreen').onclick = () => this.toggleFullscreen();

        // Warmup Input Save Listener
        document.addEventListener('input', (e) => {
          if (e.target.id === 'warmupAnswerInput') {
            localStorage.setItem('cadet_warmup_answer', e.target.value);
            const statusEl = document.getElementById('savedStatus');
            if (statusEl) {
              statusEl.classList.add('active');
              setTimeout(() => statusEl.classList.remove('active'), 2000);
            }
          }
        });
      }

      /* Core Slide Navigation with Smooth Directional Transition */
      goToSlide(index, updateHash = true) {
        if (index < 0 || index >= this.totalSlides) return;
        if (index === this.currentIndex && document.querySelector('.slide-wrapper.active')) return;

        this.currentIndex = index;

        // Update classes on all slides smoothly
        SCENES.forEach((_, idx) => {
          const slideEl = document.getElementById(`slide-${idx}`);
          if (!slideEl) return;

          slideEl.classList.remove('active', 'prev', 'next');
          if (idx === this.currentIndex) {
            slideEl.classList.add('active');
            slideEl.setAttribute('aria-hidden', 'false');
            const content = slideEl.querySelector('.slide-content');
            if (content) content.scrollTop = 0;
          } else if (idx < this.currentIndex) {
            slideEl.classList.add('prev');
            slideEl.setAttribute('aria-hidden', 'true');
          } else {
            slideEl.classList.add('next');
            slideEl.setAttribute('aria-hidden', 'true');
          }
        });

        this.updateUI();

        if (updateHash) {
          this.isUpdatingHash = true;
          window.location.hash = `#/${this.currentIndex + 1}`;
          setTimeout(() => {
            this.isUpdatingHash = false;
          }, 60);
        }
      }

      nextSlide() {
        if (this.currentIndex < this.totalSlides - 1) {
          this.goToSlide(this.currentIndex + 1);
        }
      }

      prevSlide() {
        if (this.currentIndex > 0) {
          this.goToSlide(this.currentIndex - 1);
        }
      }

      handleHashChange() {
        if (this.isUpdatingHash) return;
        const hash = window.location.hash;
        if (hash.startsWith('#/')) {
          const slideNum = parseInt(hash.replace('#/', ''), 10);
          if (!isNaN(slideNum) && slideNum >= 1 && slideNum <= this.totalSlides) {
            const targetIndex = slideNum - 1;
            if (targetIndex !== this.currentIndex) {
              this.goToSlide(targetIndex, false);
            }
          }
        }
      }

      /* Update Bar, Counter, Notes & Grid */
      updateUI() {
        const currentScene = SCENES[this.currentIndex];

        // Update Progress Bar
        const progressPct = ((this.currentIndex + 1) / this.totalSlides) * 100;
        this.progressBar.style.width = `${progressPct}%`;

        // Update Counter & Act
        this.slideCounter.textContent = `${this.currentIndex + 1} / ${this.totalSlides}`;
        this.actTag.textContent = currentScene.act;

        // Update Presenter Notes
        this.notesContent.innerHTML = currentScene.notes || "אין הערות מיוחדות לסצנה זו.";

        // Highlight Grid Item
        document.querySelectorAll('.grid-thumb-card').forEach((card, idx) => {
          if (idx === this.currentIndex) {
            card.classList.add('current');
          } else {
            card.classList.remove('current');
          }
        });
      }

      /* Overlay Toggles */
      toggleGridModal(forceState) {
        const isActive = forceState !== undefined ? forceState : !this.gridModal.classList.contains('active');
        if (isActive) {
          this.gridModal.classList.add('active');
          this.gridModal.setAttribute('aria-hidden', 'false');
        } else {
          this.gridModal.classList.remove('active');
          this.gridModal.setAttribute('aria-hidden', 'true');
        }
      }

      toggleNotesDrawer(forceState) {
        const isActive = forceState !== undefined ? forceState : !this.notesDrawer.classList.contains('active');
        if (isActive) {
          this.notesDrawer.classList.add('active');
          this.notesDrawer.setAttribute('aria-hidden', 'false');
        } else {
          this.notesDrawer.classList.remove('active');
          this.notesDrawer.setAttribute('aria-hidden', 'true');
        }
      }

      toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      /* Mini-Game logic */
      checkGameAnswer(gameId, isCorrect, btnElement) {
        const parent = btnElement.parentElement;
        const feedbackEl = document.getElementById(`gameFeedback-${gameId}`);
        const sceneData = SCENES.find(s => s.gameId === gameId);

        // Disable all buttons in this game instance
        parent.querySelectorAll('.btn-game-opt').forEach(btn => btn.disabled = true);

        if (isCorrect) {
          btnElement.classList.add('correct');
          feedbackEl.style.color = 'var(--success)';
          feedbackEl.innerHTML = `✅ נכון מאוד! ${sceneData.explanation}`;
        } else {
          btnElement.classList.add('incorrect');
          feedbackEl.style.color = 'var(--danger)';
          feedbackEl.innerHTML = `❌ לא מדויק. ${sceneData.explanation}`;
        }
      }

      /* Workshop Timer Logic */
      toggleTimer() {
        const btn = document.getElementById('btnTimerToggle');
        if (this.timerRunning) {
          clearInterval(this.timerInterval);
          this.timerRunning = false;
          if (btn) btn.innerHTML = '▶ המשך טיימר';
        } else {
          this.timerRunning = true;
          if (btn) btn.innerHTML = '⏸ השהה טיימר';
          this.timerInterval = setInterval(() => {
            if (this.timerSeconds > 0) {
              this.timerSeconds--;
              this.updateTimerDisplay();
            } else {
              clearInterval(this.timerInterval);
              this.timerRunning = false;
              if (btn) btn.innerHTML = '🎉 הזמן הסתיים!';
            }
          }, 1000);
        }
      }

      adjustTimer(deltaSeconds) {
        this.timerSeconds = Math.max(0, this.timerSeconds + deltaSeconds);
        this.updateTimerDisplay();
      }

      resetTimer() {
        clearInterval(this.timerInterval);
        this.timerRunning = false;
        this.timerSeconds = 600; // Reset to 10 minutes
        const btn = document.getElementById('btnTimerToggle');
        if (btn) btn.innerHTML = '▶ התחל טיימר';
        this.updateTimerDisplay();
      }

      updateTimerDisplay() {
        const clockEl = document.getElementById('timerClock');
        if (!clockEl) return;
        const mins = Math.floor(this.timerSeconds / 60);
        const secs = this.timerSeconds % 60;
        clockEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
    }

    // Initialize App Instance
    let app;
    window.addEventListener('DOMContentLoaded', () => {
      app = new PresentationEngine();
    });
  </script>
</body>
</html>
